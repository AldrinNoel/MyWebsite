<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=736">
<title>Interactive Image Map</title>

<style>

/* ================= BASE ================= */
body {
    margin: 0;
    background: #ffffff;
    font-family: "Segoe UI", Calibri, Arial, sans-serif;
    color: #203512;
    text-align: center;
}

/* ================= CONTAINER ================= */
.container {
    width: 736px; /* fixed width to match coordinates */
    margin: 60px auto 120px;
}

/* ================= TITLE ================= */
h1 {
    font-family: Cambria, serif;
    font-size: 2.7rem;
    margin-bottom: 15px;
}

.divider {
    width: 70px;
    height: 3px;
    background: linear-gradient(to right, #a85100, #faa500);
    margin: 20px auto 50px;
    border-radius: 5px;
}

/* ================= IMAGE ================= */
.main-image {
    width: 736px;   /* must match coordinate system */
    height: auto;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.08);
}

/* ================= DESCRIPTION ================= */
.description {
    max-width: 650px;
    margin: 40px auto 0;
    font-size: 1rem;
    opacity: 0.85;
    line-height: 1.7;
}

/* ================= STICKY HOME BUTTON ================= */
.home-button {
    position: fixed;
    bottom: 25px;
    right: 25px;
}

.home-button a {
    background: #203512;
    color: #ffffff;
    text-decoration: none;
    padding: 12px 18px;
    font-size: 12px;
    border-radius: 8px;
    letter-spacing: 1px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    transition: 0.2s ease;
}

.home-button a:hover {
    background: #faa500;
    color: #203512;
}

</style>
</head>

<body>

<div class="container">

<h1>Layers Within</h1>
<div class="divider"></div>

<img 
src="https://i.pinimg.com/736x/fb/92/2c/fb922c8c79edaa054e0032eace1e4a25.jpg"
usemap="#image-map"
class="main-image"
alt="Mapped Image">

<p class="description">
Hover and click through different parts of the image.
Each region represents a different country.
</p>

</div>

<!-- ================= IMAGE MAP ================= -->
<map name="image-map">

<area target="countryTab" alt="Italy" title="Italy"
href="italy.html"
coords="261,275,83" shape="circle">

<area target="countryTab" alt="Japan" title="Japan"
href="japan.html"
coords="380,843,523,1014" shape="rect">

<area target="countryTab" alt="Bahamas" title="Bahamas"
href="bahamas.html"
coords="5,854,182,861,195,890,163,900,96,927,24,948,3,953"
shape="poly">

<area target="countryTab" alt="Canada" title="Canada"
href="canada.html"
coords="2,431,101,478,159,517,249,554,327,583,336,593,332,660,268,691,235,707,190,701,127,673,66,669,5,629"
shape="poly">

<area target="countryTab" alt="United Kingdom" title="United Kingdom"
href="unitedkingdom.html"
coords="356,0,415,6,421,119,428,140,536,164,531,267,527,355,533,471,386,469,358,464"
shape="poly">

</map>

<!-- ================= HOME BUTTON ================= -->
<div class="home-button">
    <a href="index.html">Home</a>
</div>

</body>
</html>
